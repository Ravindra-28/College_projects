<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><h1>Expense Tracker</h1><div class="balance"><small>Balance</small><h2 id="balance">₹0</h2></div>
<form id="form"><input id="name" placeholder="Description" required><input id="amount" type="number" step="0.01" placeholder="Amount" required><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select><button>Add Transaction</button></form>
<div class="summary"><div>Income <b id="income">₹0</b></div><div>Expense <b id="expense">₹0</b></div></div><ul id="list"></ul></main><script src="script.js"></script></body></html>
