<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1>Weather App</h1>
  <p class="subtitle">Check weather for any city</p>
  <div class="search">
    <input id="cityInput" placeholder="Enter city name">
    <button onclick="getWeather()">Search</button>
  </div>
  <section id="result" class="card hidden">
    <h2 id="city"></h2>
    <div class="temp" id="temp"></div>
    <p id="condition"></p>
    <div class="details">
      <span>💧 <b id="humidity"></b> humidity</span>
      <span>💨 <b id="wind"></b> km/h wind</span>
    </div>
  </section>
  <p id="message"></p>
</main>
<script src="script.js"></script>
</body>
</html>
